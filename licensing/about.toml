# cargo-about: which licences a linked crate may carry, and for which targets.
# A dependency under a licence missing here fails the release — add it only after
# reading what it asks of a redistributor. Order is preference: of "MIT OR Apache-2.0"
# the notices name MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
