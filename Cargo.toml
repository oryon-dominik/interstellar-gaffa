[package]
name = "gaffa"
version = "2026.9.0"
edition = "2024"
authors = ["<oryon@cyberise.de>"]
description = "Cross-platform process manager for Procfile-based process-collections."
license = "MIT"
repository = "https://github.com/oryon-dominik/interstellar-gaffa"
readme = "README.md"
keywords = ["procfile", "process-manager", "foreman", "overmind", "honcho"]
categories = [
    "command-line-utilities",
    "development-tools"
]

[[bin]]
name = "gaffa"
path = "src/bin/gaffa.rs"

[[test]]
name = "non_interactive_interrupt_test"
path = "tests/non_interactive_interrupt_test.rs"

[dependencies]
tokio = { version = "1.47.0", features = ["full"] }
colored = "3.0.0"
regex = "1"
shell-words = "1.1.0"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.12"
ratatui = "0.29"
crossterm = "0.29"
cli-clipboard = "0.4"
chrono = "0.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "wincon", "handleapi", "jobapi2", "winnt", "processthreadsapi"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[package.metadata.docs.rs]
all-features = true

[badges]
github-actions = { repository = "oryon-dominik/interstellar-gaffa", branch = "trunk" }

# The changelog documentation/CHANGES.md, written by the version workflow.
[package.metadata.git-cliff.changelog]
body = """
---
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/oryon-dominik/interstellar-gaffa/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for scope, commits in commits | group_by(attribute="scope") %}
    ### {{ scope | striptags | trim | upper_first }}
    {% for group, commits in commits | group_by(attribute="group") %}
        #### {{ group | striptags | trim | upper_first }}
        {% for commit in commits
            | filter(attribute="scope")
            | filter(attribute="group")
            | sort(attribute="scope") %}
            - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
                {{ commit.message }} - ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/oryon-dominik/interstellar-gaffa/commit/{{ commit.id }}))
        {%- endfor -%}
        {% raw %}\n{% endraw %}\
    {% endfor %}\n
{% endfor %}\n
"""
footer = """
<!-- generated by @ci-bot via git-cliff -->
"""

[package.metadata.git-cliff.git]
# A release tag is a CalVer number.
tag_pattern = '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_parsers = [
    { message = '^chore\(release\)', skip = true },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Chores" },
    { message = "^docs", group = "Documentation" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = ".*", group = "Other", default_scope = "other" },
]
topo_order = false
sort_commits = "oldest"
